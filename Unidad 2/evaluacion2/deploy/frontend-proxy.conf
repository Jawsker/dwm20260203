# Solo para GitHub Codespaces (deploy/docker-compose.codespaces.yml).
# En Codespaces cada puerto tiene su propio dominio (…-8080.app.github.dev, …-8000.app.github.dev) y el navegador
# los trata como sitios distintos, lo que bloquearía la cookie de sesión. Por eso el contenedor del sitio reenvía
# /api/ al contenedor del API Gateway por la red de Docker: para el navegador, sitio y API tienen el mismo origen.
# El gateway sigue siendo el único que atiende la API y aplica todos sus controles.
ProxyRequests Off
ProxyPass        /api/ http://gateway:8000/api/
ProxyPassReverse /api/ http://gateway:8000/api/
